---
# Runs ONLY on the bootstrap control plane (tag Bootstrap=true).
- name: Is the cluster already initialised?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Installed kubeadm version (pins kubernetesVersion; no internet lookup)
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_version
  changed_when: false

- name: kubeadm configuration file
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kubeadm_config_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Wait until the NLB DNS name resolves
  ansible.builtin.command: "getent hosts {{ api_endpoint }}"
  register: kubeadm_nlb_dns
  until: kubeadm_nlb_dns.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: not kubeadm_admin_conf.stat.exists

- name: kubeadm init (control-plane endpoint = NLB, certs uploaded for joiners)
  ansible.builtin.command: >-
    kubeadm init
    --config {{ kubeadm_config_file }}
    --upload-certs
  when: not kubeadm_admin_conf.stat.exists
  register: kubeadm_init_out
  no_log: "{{ hide_secrets }}"   # output contains a bootstrap token

- name: kubeconfig for the ubuntu user
  ansible.builtin.import_tasks: kubeconfig.yml

# Fresh, short-lived join material on every run (tokens expire, the
# certificate key expires after 2 hours).
- name: Create a join token (valid {{ kubeadm_token_ttl }})
  ansible.builtin.command: "kubeadm token create --ttl {{ kubeadm_token_ttl }} --print-join-command"
  register: kubeadm_join_cmd
  changed_when: true
  no_log: "{{ hide_secrets }}"

- name: Re-upload control-plane certificates, get the decryption key
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubeadm init phase upload-certs --upload-certs --config {{ kubeadm_config_file }} 2>/dev/null | tail -1
  args:
    executable: /bin/bash
  register: kubeadm_cert_key
  changed_when: true
  no_log: "{{ hide_secrets }}"

- name: Publish join material to the next plays (in memory only)
  ansible.builtin.set_fact:
    join_command: "{{ kubeadm_join_cmd.stdout | trim }}"
    certificate_key: "{{ kubeadm_cert_key.stdout | trim }}"
  no_log: "{{ hide_secrets }}"
