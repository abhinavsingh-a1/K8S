---
- name: Set hostname (= Kubernetes node name = EC2 Name tag)
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap on reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Kernel modules to load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: "{{ os_kernel_modules | join('\n') }}\n"
    mode: "0644"

- name: Load kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop: "{{ os_kernel_modules }}"
  changed_when: false

- name: Kernel network settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      {% for k, v in os_sysctl.items() %}
      {{ k }} = {{ v }}
      {% endfor %}
    mode: "0644"
  register: sysctl_conf

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  when: sysctl_conf.changed
  changed_when: true

- name: Base packages
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gpg]
    state: present
    update_cache: true
    cache_valid_time: 3600
