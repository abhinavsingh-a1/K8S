---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Create /etc/containerd
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate default config (first run only)
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Use the systemd cgroup driver (must match kubelet)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Point crictl at containerd
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix://{{ containerd_socket }}
      image-endpoint: unix://{{ containerd_socket }}
    mode: "0644"

- name: Start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Apply config changes now (kubeadm needs the final config)
  ansible.builtin.meta: flush_handlers
