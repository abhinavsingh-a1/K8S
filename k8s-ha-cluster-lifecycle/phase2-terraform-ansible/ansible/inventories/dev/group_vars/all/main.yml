---
# Non-secret settings for the dev environment.
# Files in this folder are merged:
#   main.yml       - this file (committed)
#   terraform.yml  - generated by Terraform (NLB DNS, region, ...)
#   vault.yml      - ENCRYPTED with ansible-vault (secrets only)

ansible_user: ubuntu
# Fetched from AWS Secrets Manager by `scripts/run.sh fetch-key`
ansible_ssh_private_key_file: "~/.ssh/{{ project }}-{{ env_name }}.pem"

# ---- versions ----
k8s_minor: v1.35
pod_cidr: 10.244.0.0/16
flannel_manifest: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
ingress_nginx_version: controller-v1.13.0
ingress_controller_replicas: 2

# ---- application ----
app_host: foo.bar.com
app_namespace: default
# All playbooks live in ansible/playbooks -> repository root k8s/ folder
manifests_src: "{{ playbook_dir }}/../../../k8s/"
manifests_dest: /home/ubuntu/k8s

# ---- secrets: always reference vault_* variables through a plain name ----
# Code never uses vault_* directly, so you can see in this file which
# variables are secret and where they come from.
django_secret_key: "{{ vault_django_secret_key }}"
etcd_encryption_key: "{{ vault_etcd_encryption_key }}"
registry_server: https://index.docker.io/v1/
registry_username: "{{ vault_registry_username | default('') }}"
registry_password: "{{ vault_registry_password | default('') }}"

# Hide secret values (join tokens, keys) from Ansible output and logs.
# Set to false ONLY while debugging, never in CI logs.
hide_secrets: true
