[defaults]
# Default environment. Another one: ansible-playbook -i inventories/prod ...
inventory = inventories/dev
roles_path = roles
# Collections pinned in requirements.yml are installed into the project
collections_path = ./collections:~/.ansible/collections
host_key_checking = False
forks = 10
interpreter_python = auto_silent
callback_result_format = yaml
timeout = 30
# Vault password per environment, kept OUTSIDE the repository.
# Created by `scripts/run.sh vault-init`. Format: <vault-id>@<password file>
vault_identity_list = dev@~/.ansible/vault/k8s-ha-dev.pass

[inventory]
enable_plugins = amazon.aws.aws_ec2, ini, yaml, host_list

[ssh_connection]
pipelining = True
# Rebuilt instances can reuse an old public IP; don't record host keys.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o UserKnownHostsFile=/dev/null
