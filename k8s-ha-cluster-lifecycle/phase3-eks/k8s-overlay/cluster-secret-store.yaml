# Tells External Secrets Operator HOW to reach AWS Secrets Manager.
# No credentials here: the ESO pods get an IAM role through EKS Pod Identity
# (Terraform module app-secrets). __REGION__ is replaced by the deploy script.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: __REGION__
