# WHAT to sync: Secrets Manager "k8s-ha-eks/dev/django" (JSON) ->
# Kubernetes Secret "django-secrets", which the Deployment reads via envFrom.
# ESO re-reads every hour, so a rotation in Secrets Manager reaches the
# cluster without any deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: django-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: django-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: __SECRET_NAME__
